# Managed by dotnext install.sh (JAB-106).
# Source dotnext-api structured logs from systemd-journald. panel-api logs
# to stdout; in production the slog handler emits JSON (config auto-upgrades
# env=production to JSON unless LOG_FORMAT=text). systemd captures those lines
# under dotnext-api.service; CrowdSec tails them here. Same journalctl ingest
# shape as the Stalwart acquis (infrastructure/crowdsec/stalwart/acquis.d/).
#
# Today this feeds the JAB-4 rate-limit marker (marker=kratos_flow_rate_limited)
# into the dotnext/kratos-flow-bf scenario; any future panel security markers
# can reuse this acquisition + a sibling parser node.
source: journalctl
journalctl_filter:
  - "_SYSTEMD_UNIT=dotnext-api.service"
labels:
  type: dotnext-api
