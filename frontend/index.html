<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>dotNext</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#06B6D4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/pwa-512.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; padding: 0; }
      body[data-theme="dark"] { background: #0b0f17; color: #f1f5f9; }
      body[data-theme="light"] { background: #f8fafc; color: #0f172a; }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dotnext.themeMode");
          var mode = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", mode);
          document.addEventListener("DOMContentLoaded", function () {
            document.body.setAttribute("data-theme", mode);
          });
        } catch (e) { /* storage blocked — default dark */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
